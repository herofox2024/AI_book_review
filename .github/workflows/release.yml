name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (optional; tag is used by default)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller pytest

      - name: Run tests
        shell: pwsh
        run: python -m pytest bookreview/tests/test_pipeline_mock.py -q

      - name: Build executable
        shell: pwsh
        run: python -m PyInstaller bookreview.spec --noconfirm --clean

      - name: Verify and package
        shell: pwsh
        run: |
          $exe = "dist\AI-Book-Review.exe"
          if (-not (Test-Path $exe)) { throw "Build output not found: $exe" }
          $version = "${{ github.ref_name }}" -replace '^[vV]', ''
          if ([string]::IsNullOrWhiteSpace($version)) { $version = "${{ inputs.version }}" }
          if ([string]::IsNullOrWhiteSpace($version)) { $version = "0.0.0" }
          Copy-Item $exe "dist\AI-Book-Review-v$version-windows.exe"
          Get-Item "dist\AI-Book-Review-v$version-windows.exe" | Select-Object Name,Length

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-book-review-windows
          path: dist/AI-Book-Review-v*-windows.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/AI-Book-Review-v*-windows.exe

